# Deploy the GitHub Pages site through the Actions artifact pipeline.
# The landing pages fetch stats.json at view time; the feed is generated
# INTO the deploy artifact here — never committed to the repository — so
# no workflow writes back to main (no bot commits, no push races, and the
# activity feed counts only human commits again: the bot that used to
# commit the file no longer exists to be counted).
# Triggers mirror the retired site-stats.yml: every push to main (the
# feed is fresh right after landing work), once daily, and manual.
# Requires Settings → Pages → Build and deployment → Source: GitHub
# Actions (flipped via the Pages API, build_type: workflow).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '32 17 * * *' # 17:32 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to commit SHA so a retargeted tag cannot run code in CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history is the stats data
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Assemble the site artifact (hand-maintained pages + generated stats.json)
        run: |
          mkdir -p _site
          cp index.html index.zh-CN.html memory-architecture.html memory-architecture.zh-CN.html robots.txt sitemap.xml _site/
          cp -r assets _site/assets
          # Same generator + selfcheck the retired site-stats.yml ran; the
          # file lands in the deploy artifact, never in the repository.
          node scripts/build-site-stats.cjs --out _site/stats.json --selfcheck
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
