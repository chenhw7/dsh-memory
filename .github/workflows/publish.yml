# Publish to npm when a version tag (v*) is pushed.
#
# Auth: OIDC trusted publishing — no NPM_TOKEN secret needed. The package's
# "Trusted Publisher" setting on npmjs.com must point at this repository and
# .github/workflows/publish.yml (no environment).
#
# Release procedure:
#   npm version patch   # bump + commit + tag
#   git push origin main --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing + provenance signing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHA so a retargeted tag cannot run code in the publish job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check tag matches package.json version
        run: |
          ver="${GITHUB_REF#refs/tags/}"
          ver="${ver#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$ver" != "$pkg" ]; then
            echo "::error::tag v${ver} does not match package.json version ${pkg}"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Node 22 bundles npm 10.x; OIDC trusted publishing needs npm >= 11.5.1.
      - run: npm install -g 'npm@^11.5.1'
      - run: npm ci --no-audit --no-fund
      - run: npm publish --provenance
