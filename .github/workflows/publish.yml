# Publish to npm when a version tag (v*) is pushed.
#
# Auth: the repo secret NPM_TOKEN must be a GRANULAR access token
# (Packages: read & write, scope @chenhw7/dsh-memory) with
# "bypass two-factor authentication" enabled. Classic tokens and tokens
# without that permission are rejected by npm with E403.
#
# Release procedure:
#   npm version patch --no-git-tag-version   # bump + commit
#   git tag v<new-version>
#   git push origin main --tags
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHA so a retargeted tag cannot run code in the publish job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check tag matches package.json version
        run: |
          ver="${GITHUB_REF#refs/tags/}"
          ver="${ver#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$ver" != "$pkg" ]; then
            echo "::error::tag v${ver} does not match package.json version ${pkg}"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Writes .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # so the npm publish step can authenticate.
          registry-url: https://registry.npmjs.org/
      - run: npm ci --no-audit --no-fund
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
