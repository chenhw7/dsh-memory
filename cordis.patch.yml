# @chenhw7/dsh-memory — long-term memory bundle patch for the DeepSeek Harness.
#
# Installs the memory store provider, nine model-facing memory tools plus the
# identity_update agent tool, automatic
# review + flush extraction, the project-notes prompt projection, the identity
# layer, and system-prompt context injection as ONE layer over dsh-base. The
# memory rows point at this
# package's own export sub-paths; the two storage rows are NOT inserted here
# because dsh-web-app already provides them (storage-json + storage-domain
# with the correct root path). For a headless profile that has no storage
# layer, see the README's "headless" section — add the storage rows to your
# profile's cordis.patch.yml instead of letting this bundle insert them
# (last-write-wins would clobber the web-app's root config otherwise).
#
# Row order carries no load semantics; the grouping is for readers.
#
# Row ids are also the settings namespaces: each row's module declares the
# Config its page edits (`memory`, `memory-review`, `memory-identity`,
# `memory-notes`, `memory-autorecall`), and the host's plugin pages address a
# row's configuration by exactly this id. Renaming a row renames its settings
# entry, so stored user overrides under the old id stop applying.

- insert:
    # Root entry: lets the host client-module scanner discover dsh.client.
    # No host-side code runs; this is a no-op plugin that exists solely so
    # the scanner can resolve this package's package.json from a root spec.
    - id: memory-root
      name: '@chenhw7/dsh-memory'

    # Memory store provider — opens the 'memory' domain, registers ctx.memory,
    # and publishes the shared injection/recall settings the sibling rows read
    # back through that service. Requires the storage-domain facility
    # (provided by dsh-web-app; headless users must add storage-domain
    # themselves — see README).
    - id: memory
      name: '@chenhw7/dsh-memory/store'

    # Model-facing memory tools (memory_search/add/replace/remove/list/get).
    - id: memory-tools
      name: '@chenhw7/dsh-memory/tool'

    # Automatic extraction: projection accumulator + compaction/dispose flush.
    - id: memory-review
      name: '@chenhw7/dsh-memory/review'

    # Project notes: renders habit/convention/pitfall entries from the store
    # into the `project-notes` prompt section (no repo files since 0.6) and
    # cleans up file-export artifacts left by ≤0.5.x.
    - id: memory-notes
      name: '@chenhw7/dsh-memory/notes'

    # Identity layer: seeds and reads the agent's self-documents (SOUL.md /
    # USER.md) from the store's identity tables; memory-autorecall injects them
    # as the `soul` (80) and `user-profile` (81) prompt sections.
    - id: memory-identity
      name: '@chenhw7/dsh-memory/identity'

    # System-prompt section injection + the step-tail digest/recall fence. Owns
    # the `memory-autorecall` settings entry (the fence and the hit signal).
    - id: memory-autorecall
      name: '@chenhw7/dsh-memory/context'

    # @Remote service for the memory management UI (§7.7). The write switch
    # defaults to false (deny by default — see the remote-write-guard Agent
    # Note); this deployment drives the management UI, so it opts in here.
    - id: memory-remote
      name: '@chenhw7/dsh-memory/remote-service'
      config:
        remoteWritesEnabled: true
